        body {
            background-color: #F4F1EA; /* Warm ivory background as requested, overriding config background for this specific request */

    body {
      min-height: max(884px, 100dvh);

<body class="text-on-surface antialiased flex flex-col min-h-screen font-body-lg">
<!-- TopAppBar from JSON -->
<header class="w-full top-0 sticky bg-surface dark:bg-inverse-surface border-b border-outline-variant dark:border-outline shadow-sm z-50">
<div class="flex justify-between items-center h-16 px-margin-desktop max-w-7xl mx-auto transition-all duration-200 ease-in-out">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="monitoring">monitoring</span>
<span class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim">EcoAdmin</span>
</div>
<!-- Navigation links logic: Web only (md:flex), hidden on mobile. -->
<nav class="hidden md:flex gap-gutter items-center">
<a class="text-primary dark:text-primary-fixed-dim font-bold border-b-2 border-primary dark:border-primary-fixed-dim pb-1 font-title-lg text-title-lg" href="#">Home</a>
<a class="text-on-secondary-fixed-variant dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed-dim transition-colors font-title-lg text-title-lg hover:bg-surface-container-low dark:hover:bg-surface-container-highest px-2 py-1 rounded" href="#">Reports</a>
<a class="text-on-secondary-fixed-variant dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed-dim transition-colors font-title-lg text-title-lg hover:bg-surface-container-low dark:hover:bg-surface-container-highest px-2 py-1 rounded" href="#">Settings</a>
</nav>
<!-- Mobile Menu Placeholder -->
<button class="md:hidden p-2 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow px-margin-mobile md:px-margin-desktop py-lg max-w-7xl mx-auto w-full">
<div class="grid grid-cols-1 gap-md">
<!-- Stat Card 1 -->
<div class="bg-surface-container-lowest border border-[#E5E1D5] rounded-xl p-md shadow-sm hover:-translate-y-1 transition-transform duration-300">
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-sm">Active Users</p>
<h2 class="font-display-lg text-display-lg text-primary-container mb-xs">1,284</h2>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary-container text-sm" data-icon="trending_up">trending_up</span>
<p class="font-body-md text-body-md text-secondary">+12% from last month</p>
</div>
</div>
<!-- Stat Card 2 -->
<div class="bg-surface-container-lowest border border-[#E5E1D5] rounded-xl p-md shadow-sm hover:-translate-y-1 transition-transform duration-300">
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-sm">Total Revenue</p>
<h2 class="font-display-lg text-display-lg text-primary-container mb-xs">$12,450</h2>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-secondary text-sm" data-icon="pie_chart">pie_chart</span>
<p class="font-body-md text-body-md text-secondary">Quarterly target: 80%</p>
</div>
</div>
<!-- Stat Card 3 -->
<div class="bg-surface-container-lowest border border-[#E5E1D5] rounded-xl p-md shadow-sm hover:-translate-y-1 transition-transform duration-300">
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-sm">Pending Tasks</p>
<h2 class="font-display-lg text-display-lg text-primary-container mb-xs">24</h2>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-error text-sm" data-icon="priority_high">priority_high</span>
<p class="font-body-md text-body-md text-secondary">5 high priority</p>
</div>
</div>
</div>
</main>
<!-- Footer from JSON -->
<footer class="w-full mt-auto bg-surface-container-low dark:bg-surface-container-highest border-t border-outline-variant dark:border-outline">
<div class="flex flex-col md:flex-row justify-between items-center py-lg px-margin-desktop max-w-7xl mx-auto opacity-80 hover:opacity-100">

</div>

</div>
