        body { background-color: #F8FAFC; }

<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col relative pb-16 md:pb-0">
<!-- TopAppBar -->
<header class="bg-surface w-full top-0 sticky z-50">
<div class="flex items-center justify-between px-container-padding h-16 w-full z-50">
<button class="text-primary hover:bg-surface-container-high transition-colors active:scale-95 duration-150 transition-transform p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Search</h1>
<button class="text-primary hover:bg-surface-container-high transition-colors active:scale-95 duration-150 transition-transform p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow px-container-padding relative">
<!-- Search Input Wrapper (Elevated over blurred content) -->
<div class="relative z-20 mt-4">
<div class="relative bg-surface-container-lowest rounded-xl border border-secondary-container search-shadow overflow-visible">
<div class="flex items-center px-gutter h-[48px]">
<span class="material-symbols-outlined text-outline mr-sm">search</span>
<input autofocus="" class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-lg p-0 m-0" placeholder="Search projects, tasks, or people" type="text" value="Desi"/>
<div class="w-[2px] h-[20px] bg-secondary-container ml-1 animate-pulse"></div>
<span class="text-outline-variant font-label-caps ml-sm hidden md:block">⌘K</span>
</div>
<!-- Dropdown Suggestions -->
<div class="absolute top-full left-0 right-0 mt-xs bg-surface-container-lowest rounded-xl border border-outline-variant dropdown-shadow overflow-hidden z-30">
<ul class="py-sm">
<li class="px-md py-sm hover:bg-surface-container-low cursor-pointer flex items-center gap-md">
<span class="material-symbols-outlined text-outline-variant">folder_open</span>
<span class="font-body-md text-on-surface"><span class="font-bold text-primary">Desi</span>gn system</span>
</li>
<li class="px-md py-sm hover:bg-surface-container-low cursor-pointer flex items-center gap-md">
<span class="material-symbols-outlined text-outline-variant">folder_open</span>
<span class="font-body-md text-on-surface"><span class="font-bold text-primary">Desi</span>gn review</span>
</li>
<li class="px-md py-sm hover:bg-surface-container-low cursor-pointer flex items-center gap-md">
<span class="material-symbols-outlined text-outline-variant">folder_open</span>
<span class="font-body-md text-on-surface"><span class="font-bold text-primary">Desi</span>gner recruitment</span>
</li>
<li class="px-md py-sm hover:bg-surface-container-low cursor-pointer flex items-center gap-md">
<span class="material-symbols-outlined text-outline-variant">folder_open</span>
<span class="font-body-md text-on-surface"><span class="font-bold text-primary">Desi</span>gn feedback</span>
</li>
</ul>
</div>
</div>
</div>
<!-- Blurred Background Content -->
<div class="mt-xl blurry-bg z-10 select-none pointer-events-none">
<h2 class="font-headline-sm text-on-surface-variant mb-md">Recent Projects</h2>
<div class="grid grid-cols-1 gap-md">
<!-- Skeleton/Blurred Card 1 -->
<div class="bg-surface-container-lowest p-md rounded-lg border border-outline-variant">
<div class="flex items-center gap-md mb-sm">
<div class="w-8 h-8 rounded-full bg-surface-variant"></div>
<div class="h-4 bg-surface-variant rounded w-1/3"></div>
</div>
<div class="h-3 bg-surface-variant rounded w-full mb-xs"></div>
<div class="h-3 bg-surface-variant rounded w-5/6"></div>
</div>
<!-- Skeleton/Blurred Card 2 -->
<div class="bg-surface-container-lowest p-md rounded-lg border border-outline-variant">

<div class="h-4 bg-surface-variant rounded w-1/4"></div>
</div>

</div>

<span class="material-symbols-outlined mb-1">task_alt</span>
<span class="font-label-sm text-label-sm">Tasks</span>
</a>

<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
</nav>
<!-- Keep focus on input for demo purposes -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.querySelector('input[type="text"]');
            if(input) {
                input.focus();
                // Move cursor to end
                const val = input.value;
                input.value = '';
                input.value = val;
            }
        });
    </script>
