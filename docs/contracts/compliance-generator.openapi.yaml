# OpenAPI Contract Specification for Compliance Generator
# Specifies paths for coverage audit and task plan validation
openapi: 3.0.3
info:
  title: Compliance Generator API Contract
  version: 1.0.0
  description: >
    API contract for strict specification coverage audits and task plan validations.
    This contract specifies endpoints for coverage audit and task plan validation.
    Access Control Requirements (RBAC):
    - Administrator and Content Manager: Full access to validation endpoints.
    - Other roles: Access is forbidden.
servers:
  - url: /api/v1
paths:
  /compliance/coverage-audit:
    post:
      summary: Perform strict specification coverage audit
      description: >
        Validates coverage audits against client specifications, ensuring unaddressed
        requirements list real gaps and blocking falsified compliance reports.
        Accessible by Administrator and Content Manager.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverageAuditRequest'
      responses:
        '200':
          description: Coverage audit successfully validated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageAuditResponse'
        '400':
          description: Invalid validation or falsification attempt detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /compliance/task-plan:
    post:
      summary: Validate task plan coverage and constraints
      description: >
        Validates task plans against specifications, checks TOC constraints, and evaluates ECHO duplicate planning cycles.
        Accessible by Administrator and Content Manager.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPlanValidationRequest'
      responses:
        '200':
          description: Task plan successfully validated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPlanValidationResponse'
        '400':
          description: Invalid validation, qualitative TOC ref, or falsification attempt detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    UnauthorizedError:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: The authenticated user does not have access to this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Specification:
      type: object
      required:
        - sections
      properties:
        sections:
          type: array
          items:
            type: string
          example: ["sec1_document_storage", "sec2_fulltext_search"]

    CoverageAudit:
      type: object
      required:
        - gaps
        - addressedSections
      properties:
        gaps:
          type: array
          items:
            type: string
          example: []
        addressedSections:
          type: array
          items:
            type: string
          example: ["sec1_document_storage"]

    CoverageAuditRequest:
      type: object
      required:
        - specification
        - audit
      properties:
        specification:
          $ref: '#/components/schemas/Specification'
        audit:
          $ref: '#/components/schemas/CoverageAudit'

    CoverageAuditResponse:
      type: object
      required:
        - status
        - audit
      properties:
        status:
          type: string
          example: "VALIDATED"
        audit:
          $ref: '#/components/schemas/CoverageAudit'

    TaskPlan:
      type: object
      required:
        - title
        - jtbd
        - coverageComplete
        - tocConstraintRef
        - requirementRefs
      properties:
        title:
          type: string
          example: "Complete Knowledge Base Plan"
        jtbd:
          type: string
          example: "Implement all 9 sections of the educational knowledge base specification."
        coverageComplete:
          type: boolean
          example: true
        tocConstraintRef:
          type: string
          example: "document-retrieval-throughput"
        requirementRefs:
          type: array
          items:
            type: string
          example: ["R1", "R2"]

    TaskPlanValidationRequest:
      type: object
      required:
        - plan
        - specification
        - implementedSections
      properties:
        plan:
          $ref: '#/components/schemas/TaskPlan'
        specification:
          $ref: '#/components/schemas/Specification'
        implementedSections:
          type: array
          items:
            type: string
          example: ["sec1_document_storage"]
        existingNetwork:
          type: array
          items:
            $ref: '#/components/schemas/TaskPlan'

    TaskPlanValidationResponse:
      type: object
      required:
        - status
        - plan
      properties:
        status:
          type: string
          example: "VALIDATED"
        plan:
          $ref: '#/components/schemas/TaskPlan'

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "BAD_REQUEST"
        message:
          type: string
          example: "Falsified Coverage Audit Blocked: Empty 'gaps' array reported while sections are completely unaddressed."
