# API Contract Specification under BARCAN-TAG-12 (API Contract Designer)
# Grounded in wishlist 98f1e6f8-d684-4f4b-957e-8c4dd0d0af6e
openapi: 3.0.3
info:
  title: Financial Documents API Contract
  version: 1.0.0
  description: >
    API contract for HR and financial document retrieval.
    This contract specifies restricted endpoints for stipends, teacher load, and budget cycles.
    Access control constraints:
    - Economists, Accountants, and Head of Educational Center: Full access to all sections (Budget, Load, Stipends, Reports).
    - Teachers: Read-only access to methodologies, individual plan templates, load calculations, and stipends.
    - Postgraduates and Residents: Read-only access ONLY to stipends and general regulations (no access to load or budget).
servers:
  - url: /api
paths:
  /financial/budget:
    get:
      summary: Retrieve budget reports and metadata
      description: >
        Returns budget report documents and metadata.
        Accessible by Economists, Accountants, and Head of Educational Center.
        Access is forbidden for Teachers, Postgraduates, and Residents.
      security:
        - BearerAuth: []
      parameters:
        - name: academicYear
          in: query
          required: false
          schema:
            type: string
            example: "2026-2027"
      responses:
        '200':
          description: A list of budget report documents and metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinancialDocument'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /financial/stipends:
    get:
      summary: Retrieve stipend-related documents and calculations
      description: >
        Returns stipend/scholarship guidelines and calculation data.
        Accessible by Economists, Accountants, Head of Educational Center, Teachers, and Postgraduates/Residents.
      security:
        - BearerAuth: []
      parameters:
        - name: program
          in: query
          description: Filter by educational program (postgraduate/residency)
          required: false
          schema:
            $ref: '#/components/schemas/ProgramType'
        - name: academicYear
          in: query
          description: Filter by academic year
          required: false
          schema:
            type: string
            example: "2026-2027"
      responses:
        '200':
          description: A list of stipend documents and metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinancialDocument'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /financial/load:
    get:
      summary: Retrieve teacher load calculations and templates
      description: >
        Returns load calculations and templates.
        Accessible by Economists, Accountants, Head of Educational Center, and Teachers (read-only).
        Access is forbidden for Postgraduates/Residents.
      security:
        - BearerAuth: []
      parameters:
        - name: academicYear
          in: query
          required: false
          schema:
            type: string
            example: "2026-2027"
      responses:
        '200':
          description: A list of teacher load documents and metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinancialDocument'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    UnauthorizedError:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: The authenticated user does not have access to this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    DocumentType:
      type: string
      enum:
        - Position # Положение
        - Procedure # Порядок
        - Project # Проект
        - Other # Иное
      description: Type of document card mandatory metadata field.

    ProgramType:
      type: string
      enum:
        - postgraduate # аспирантура
        - residency # ординатура
        - both # обе программы
      description: Specialized program/direction field.

    ProcessType:
      type: string
      enum:
        - admission # приём
        - certification # аттестация
        - stipends # стипендии
        - practice # практика
        - result_tracking # учёт результатов
        - other # иное
      description: Specialized process/procedure field.

    FinancialDocument:
      type: object
      description: Represents a physical financial or HR document card with specialized metadata and permissions.
      required:
        - id
        - title
        - documentType
        - academicYear
        - program
        - process
        - version
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Universally unique identifier for the document
          example: "d3b07384-d113-49c3-a5e2-63bc40428efc"
        title:
          type: string
          description: Full name of the document without abbreviations
          example: "Положение о порядке расчета стипендий аспирантов"
        description:
          type: string
          description: Comprehensive summary of the document purpose and contents
          example: "Регламентирует порядок назначения и выплаты стипендий за успехи в учебе."
        documentType:
          $ref: '#/components/schemas/DocumentType'
        academicYear:
          type: string
          description: Academic year or validity period (e.g., "2026–2027", "infinite", "project")
          example: "2026–2027"
        program:
          $ref: '#/components/schemas/ProgramType'
        process:
          $ref: '#/components/schemas/ProcessType'
        approvalDate:
          type: string
          format: date
          description: Optional date of document approval by the educational center
          example: "2026-09-01"
        documentNumber:
          type: string
          description: Optional registration number of the document (e.g. '123-P')
          example: "123-P"
        version:
          type: string
          description: Version tag (e.g., "1.0", "2.0") conforming to update regulations
          example: "1.0"
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last document update or version transition
          example: "2026-09-15T10:30:00Z"
        budgetCycleMetadata:
          $ref: '#/components/schemas/BudgetCycleMetadata'
        schemaTags:
          type: array
          items:
            type: string
          description: >
            Schema tags for classification and fast search.
            Can include block tags (Budget, Load, Stipends, Reports) and functional classification tags:
            - "Book" (Книга): For structured guides with chapters and table of contents.
            - "Glossary" (Глоссарий): For term definitions.
          example: ["Budget", "Load", "Book"]

    BudgetCycleMetadata:
      type: object
      required:
        - budgetCycle
        - estimatedAmount
        - currency
        - status
        - quarter
      description: Specialized metadata schema for tracking the budget cycle details for financial documents.
      properties:
        budgetCycle:
          type: string
          description: The name or identifier of the budget cycle (e.g. '2026 Budget Cycle', '2026-2027 Budget', '2026 Cycle')
          example: "2026 Budget Cycle"
        estimatedAmount:
          type: number
          format: double
          description: Estimated amount allocated/assigned for this budget cycle context
          example: 1500000.00
        currency:
          type: string
          description: ISO currency code or currency symbol (e.g. 'RUB')
          example: "RUB"
        status:
          type: string
          enum:
            - DRAFT
            - REVIEW
            - APPROVED
            - ARCHIVED
          description: The state of the budget cycle within the planning workflow
          example: "APPROVED"
        quarter:
          type: string
          enum:
            - Q1
            - Q2
            - Q3
            - Q4
            - ANNUAL
          description: Specific quarter or annual indicator for this budget cycle context
          example: "Q1"
        fiscalYear:
          type: integer
          description: Fiscal year for the budget cycle tracking
          example: 2026

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "ACCESS_DENIED"
        message:
          type: string
          example: "User is not authorized to view load documents."
